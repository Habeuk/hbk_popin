hbk_popin.save.message:
  path: '/hbk-popin/save/message'
  defaults:
    _title: 'Send message'
    _controller: '\Drupal\hbk_popin\Controller\HbkPopinController'
  requirements:
    _permission: 'access content'

entity.hbk_popin_whatsapp_message.settings:
  path: 'admin/structure/hbk-popin-whatsapp-message'
  defaults:
    _form: '\Drupal\hbk_popin\Form\WhatsappMessageSettingsForm'
    _title: 'whatsapp_message'
  requirements:
    _permission: 'administer hbk_popin_whatsapp_message'
